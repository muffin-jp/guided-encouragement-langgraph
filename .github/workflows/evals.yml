name: Prompt evals

# These evals call the paid Claude API (generation + distress classifier +
# LLM-as-judge), so they run on changes that can affect model behaviour —
# prompts, the graph/nodes, and the eval harness itself — rather than on every
# push. Trigger manually anytime via the "Run workflow" button.
on:
  pull_request:
    paths:
      - "app/prompts/**"
      - "sql/**"
      - "app/graph/**"
      - "app/rag/**"
      - "app/classifier/**"
      - "app/config.py"
      - "evals/**"
      - ".github/workflows/evals.yml"
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    # The real eval is grounded against the same pgvector store production runs.
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bloom
          POSTGRES_PASSWORD: bloom
          POSTGRES_DB: bloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bloom -d bloom"
          --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://bloom:bloom@localhost:5432/bloom
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies (rag embedder + pgvector driver)
        run: uv sync --extra rag --extra pgvector

      # Vendors the pinned weights (network open here) for the seed and the eval.
      - name: Fetch embedding model
        run: make fetch-model

      # Schema → seed from corpus.jsonl → guard. db-check against a fresh seed
      # should always pass; it proves the seed and the guard agree.
      - name: Migrate and seed pgvector
        run: |
          make db-migrate-url
          make db-seed
          make db-check

      - name: Run eval suite (real API, grounded)
        run: uv run python evals/run.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Always upload results, even when the gate fails, so reviewers can read
      # the per-case detail and judge reasons from the failing run.
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
