name: CI

# Fast checks that need no API key: lint, types, unit tests, and an offline
# (dry) eval harness run. Runs on every push and PR.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync

      - name: Ruff (lint + format)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Pyright (strict)
        run: uv run pyright

      - name: Pytest
        run: uv run pytest -q

      - name: Eval harness (dry, offline)
        run: uv run python evals/run.py --dry
